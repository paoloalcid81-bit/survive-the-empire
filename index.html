<head>

        :root {

            --ink: #2b2118;
            --blood: #8b1e1e;

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

       body {
    font-family: 'Georgia', serif;
    background: transparent;
    color: var(--ink);
    margin: 0;
    padding: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
}

        #game-wrapper {

            padding: 0.25rem 0.5rem;
            border-radius: 3px;
            cursor: pointer;
            opacity: 0.8;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            transition: all 0.15s ease-in-out;

        .top-nav-btn:hover {

        button.choice-btn {

        .footer-share-section {

</head>
<body>

<div id="game-wrapper">
    <button class="top-nav-btn home-btn" onclick="goHome()" title="Return to Intro">
        <svg class="home-icon-svg" viewBox="0 0 24 24">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
        <span>Home</span>
    </button>

    <button class="top-nav-btn music-btn" id="music-toggle" onclick="toggleBGM()">Music: OFF</button>

    <div class="header-tag">Survive the Empire</div>
    <h1 class="title">Can You Survive Spanish Colonial Life?</h1>
    
    <div id="game-content"></div>

    <div class="footer-share-section">
        <span>Share:</span>
        <button class="share-btn share-fb" onclick="shareFacebook()">Facebook</button>

        <button class="share-btn share-copy" onclick="copyGameLink()">Copy Link</button>
    </div>
</div>

<script>
    let audioCtx = null;
    let isBgmPlaying = false;
    let bgmInterval = null;

    function initAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    const bgmScale = [220, 261.63, 329.63, 392.00, 440, 523.25, 392.00, 329.63];
    let bgmStep = 0;

    function playHarpsichordPluck(freq) {
        if (!audioCtx || !isBgmPlaying) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.9);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.9);
        } catch (e) {}
    }

    function startBGM() {
        initAudioContext();
        if (isBgmPlaying) return;
        isBgmPlaying = true;
        document.getElementById('music-toggle').innerText = "Music: ON";
        bgmInterval = setInterval(() => {
            if (isBgmPlaying) {
                playHarpsichordPluck(bgmScale[bgmStep]);
                bgmStep = (bgmStep + 1) % bgmScale.length;
            }
        }, 550);
    }

    function stopBGM() {
        isBgmPlaying = false;
        if (bgmInterval) clearInterval(bgmInterval);
        document.getElementById('music-toggle').innerText = "Music: OFF";
    }

    function toggleBGM() {
        if (isBgmPlaying) stopBGM();
        else startBGM();
    }

    function playDing() {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
            osc.frequency.setValueAtTime(880.00, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.6);
        } catch (e) {}
    }

    function playDeathSound() {
        if (!audioCtx) return;
        try {
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = "sawtooth";
            osc1.frequency.setValueAtTime(160, audioCtx.currentTime);
            osc1.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 1.8);
            gain1.gain.setValueAtTime(0.35, audioCtx.currentTime);
            gain1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.8);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start();
            osc1.stop(audioCtx.currentTime + 1.8);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = "triangle";
            osc2.frequency.setValueAtTime(115, audioCtx.currentTime);
            osc2.frequency.exponentialRampToValueAtTime(28, audioCtx.currentTime + 1.8);
            gain2.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.8);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start();
            osc2.stop(audioCtx.currentTime + 1.8);
        } catch (e) {}
    }

    function playVictoryFanfare() {
        if (!audioCtx) return;
        try {
            const notes = [
                { f: 523.25, time: 0.0, dur: 0.15 },
                { f: 659.25, time: 0.18, dur: 0.15 },
                { f: 783.99, time: 0.36, dur: 0.15 },
                { f: 1046.50, time: 0.54, dur: 0.60 }
            ];
            notes.forEach(note => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "triangle";
                osc.frequency.setValueAtTime(note.f, audioCtx.currentTime + note.time);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime + note.time);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + note.time + note.dur);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + note.time);
                osc.stop(audioCtx.currentTime + note.time + note.dur);
            });
        } catch (e) {}
    }

    const defaultQuestionPool = [

            ],
            history: "The 1884 Royal Decree replaced the archaic tribute system with the mandatory Cédula Personal identity tax certificate."

        {

        {

            choices: [
                { text: "Banned copies of José Rizal's Noli Me Tángere and La Solidaridad", result: "SURVIVE" },
                { text: "A crate of registered dried fish with official municipal tax stamps", result: "DIED: You hid the fish but left subversive political pamphlets on deck. Executed at Bagumbayan." },
                { text: "A devotional rosary and a Tagalog prayer booklet", result: "DIED: You hid the prayer book while the inspector found anti-friar manifestos tucked in your belt. Arrested for filibusterismo." }

    let sessionDeck = [];
    let currentStep = 0;
    let daysSurvived = 0;

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function goHome() {
        renderIntroScreen();
    }

    function renderIntroScreen() {
        const container = document.getElementById('game-content');
        container.innerHTML = `
            <div class="intro-box">
                <div class="intro-lore">
                    You are from present day in a former Spanish colony. Through an inexplicable twist of fate, you wake up in 
                    <strong>Spanish colonial Filipinas (circa 1565–1898)</strong>. 
                    <br><br>
                    You are now bound by strict curfews, monastic decrees, forced labor and caste etiquette. One wrong assumption or breach of protocol will result in immediate execution, fatal disease or penal exile.
                    <span class="intro-challenge">Can you survive all 25 trials?</span>
                </div>
                <button class="action-btn" onclick="startGameFromIntro()">Enter</button>
            </div>
        `;
    }

    function startGameFromIntro() {
        startBGM();
        startNewGame();
    }

    function startNewGame() {
        const poolCopy = [...defaultQuestionPool];
        shuffle(poolCopy);
        sessionDeck = poolCopy;
        currentStep = 0;
        daysSurvived = 0;
        renderScenario();
    }

    function renderScenario(animateGreen = false) {
        const container = document.getElementById('game-content');
        const totalDays = sessionDeck.length;

        if (currentStep >= sessionDeck.length) {
            playVictoryFanfare();
            container.innerHTML = `
                <div class="death-screen" style="border-color: var(--gold); background: #fdfaf0;">
                    <div class="header-tag" style="color: var(--gold);">Gloria Y Victoria</div>
                    <div class="death-title" style="color: var(--gold);">Sobreviviente!</div>
                    <p style="font-size: 1.1rem; margin: 1rem 0; line-height: 1.6;">
                        Against all odds, you navigated the decrees, curfews, tithes, and inquisitions. 
                        <strong>You survived all 25 trials of the Empire!</strong>
                    </p>
                    <button class="action-btn" style="background: var(--border);" onclick="startNewGame()">Play Again</button>
                </div>
            `;
            return;
        }

        const currentQ = sessionDeck[currentStep];
        const shuffledChoices = shuffle([...currentQ.choices]);

        container.innerHTML = `
            <div class="era-header">${currentQ.era}</div>
            <div id="day-counter" class="day-counter-box ${animateGreen ? 'ding-green' : ''}">
                Scenario ${daysSurvived + 1}/${totalDays} (Score: ${daysSurvived})
            </div>
            <div class="divider"></div>
            <div class="scenario-box">${currentQ.scenario}</div>
            <div class="choices-grid" id="choices-container"></div>
        `;

        const choicesContainer = document.getElementById('choices-container');
        shuffledChoices.forEach(choice => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = choice.text;
            btn.onclick = () => handleChoice(choice, currentQ, btn);
            choicesContainer.appendChild(btn);
        });
    }

    function handleChoice(choice, questionData, clickedBtn) {
        if (choice.result === "SURVIVE") {
            playDing();
            daysSurvived++;
            currentStep++;
            if (clickedBtn) clickedBtn.classList.add('correct-glow');
            
            setTimeout(() => {
                renderScenario(true);
            }, 300);
        } else {
            playDeathSound();
            renderDeathScreen(choice.result, questionData);
        }
    }

    function renderDeathScreen(deathReason, questionData) {
        const container = document.getElementById('game-content');
        container.innerHTML = `
            <div class="death-screen">
                <div class="header-tag" style="color: var(--blood);">Certificado de Defunción</div>
                <div class="death-title">DEAD</div>
                <div class="death-reason"><strong>Cause of Death:</strong> ${deathReason.replace('DIED: ', '')}</div>
                <div class="history-note"><strong>Historical Reality:</strong> ${questionData.history}</div>
                <div style="margin-top: 1rem; font-size: 0.95rem; font-weight: bold; color: var(--border);">
                    You survived ${daysSurvived} Scenarios.
                </div>
                <button class="action-btn" onclick="startNewGame()">Try Again</button>
            </div>
        `;
    }

    function getShareText() {
        if (daysSurvived > 0) {
            return `I survived ${daysSurvived} scenarios in 'Survive the Empire: Spanish Colonial Life!' Can you beat my score?`;
        }
        return `Can you survive Spanish colonial life? Test your survival skills in 'Survive the Empire'!`;
    }

    function shareFacebook() {
        const url = encodeURIComponent(window.location.href);
        window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank', 'width=600,height=400');
    }

    function shareX() {
        const url = encodeURIComponent(window.location.href);
        const text = encodeURIComponent(getShareText());
        window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank', 'width=600,height=400');
    }

    function copyGameLink() {
        const shareText = `${getShareText()} ${window.location.href}`;
        navigator.clipboard.writeText(shareText).then(() => {
            alert("Game link and score copied to clipboard!");
        }).catch(() => {
            alert("Failed to copy link. Please share the URL directly.");
        });
    }

    renderIntroScreen();
</script>

</body>
