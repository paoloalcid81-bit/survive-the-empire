<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Can You Survive 30 Days of Spanish Colonial Life?</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-N40VPM9JWW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-N40VPM9JWW');
    </script>

    <!-- Open Graph Social Preview -->
    <meta property="og:title" content="Can You Survive 30 Days of Spanish Colonial Life?">
    <meta property="og:description" content="A historical survival trivia game set in Spanish-era Filipinas (1565–1898). Can you survive 30 temporal shifts?">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://survivetheempire.paoloalcid.com/">
    <meta property="og:image" content="https://survivetheempire.paoloalcid.com/images/death-preview.jpg">

    <style>
        :root {
            --bg-parchment: #f4ece1;
            --parchment-card: #fdfaf4;
            --parchment-dark: #eee3d0;
            --ink: #2b231a;
            --ink-muted: #5e5043;
            --border: #7c6a58;
            --crimson: #7c1a1a;
            --green: #245831;
            --gold: #b38b34;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
    background-color: var(--bg-parchment);
}

body {
    width: 100%;
    min-height: 100vh;
    height: auto;
    margin: 0;
    padding: 24px 16px;
    background-color: var(--bg-parchment);
    color: var(--ink);
    font-family: 'Georgia', 'Times New Roman', serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow-x: hidden;
}

.game-wrapper {
    background-color: var(--parchment-card);
    border: 2px solid var(--border);
    box-shadow: inset 0 0 0 3px var(--parchment-card), inset 0 0 0 5px var(--border), 0 8px 24px rgba(43, 35, 26, 0.2);
    border-radius: 4px;
    width: 100%;
    max-width: 580px;
    padding: 1.25rem;
    margin: 0 auto;
}

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .top-nav-btn {
            background: none;
            border: 1px solid var(--border);
            font-family: 'Georgia', serif;
            font-size: 0.75rem;
            color: var(--ink);
            padding: 0.25rem 0.5rem;
            cursor: pointer;
            border-radius: 2px;
            background-color: var(--parchment-dark);
            text-transform: uppercase;
        }

        .header-tag {
            text-align: center;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold);
            font-weight: bold;
            margin-bottom: 0.25rem;
        }

        h1.title {
            text-align: center;
            font-size: 1.15rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--ink);
            line-height: 1.35;
            margin-bottom: 0.75rem;
        }

        .decorative-hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 0.75rem 0 1rem;
        }

        .intro-box {
            background: rgba(238, 227, 208, 0.45);
            border-left: 3px solid var(--gold);
            padding: 1.1rem;
            border-radius: 2px;
            margin-bottom: 1.25rem;
            font-size: 0.95rem;
            line-height: 1.55;
        }

        .intro-challenge {
            display: block;
            margin-top: 1rem;
            font-weight: bold;
            color: var(--crimson);
            font-size: 1rem;
            text-align: center;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--ink-muted);
            border-bottom: 1px dashed var(--border);
            padding-bottom: 0.4rem;
            margin-bottom: 0.8rem;
            text-transform: uppercase;
        }

        .scenario-box {
            background: rgba(238, 227, 208, 0.35);
            border-left: 3px solid var(--border);
            padding: 0.9rem;
            border-radius: 2px;
            margin-bottom: 1rem;
            font-size: 0.92rem;
            line-height: 1.5;
        }

        .scenario-year {
            font-weight: bold;
            color: var(--crimson);
            margin-bottom: 0.35rem;
        }

        .scenario-image {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border: 1px solid var(--border);
            border-radius: 2px;
            margin: 0.5rem 0;
            display: block;
        }

        .scenario-source {
            font-size: 0.75rem;
            color: var(--ink-muted);
            font-style: italic;
            margin-top: 0.4rem;
        }

        .choices-grid {
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            margin-bottom: 1rem;
        }

        button.choice-btn {
            background-color: var(--parchment-dark);
            color: var(--ink);
            border: 1px solid var(--border);
            padding: 0.75rem 0.85rem;
            font-family: 'Georgia', serif;
            font-size: 0.88rem;
            line-height: 1.35;
            border-radius: 3px;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s ease-in-out;
            box-shadow: 1px 1px 0px rgba(82, 63, 47, 0.2);
        }

        button.choice-btn:hover {
            background-color: var(--border);
            color: var(--parchment-card);
        }

        .action-btn {
            display: block;
            width: 100%;
            background-color: var(--crimson);
            color: #fff;
            border: 1px solid #4a0f0f;
            padding: 0.75rem;
            font-family: 'Georgia', serif;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 3px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
        }

        .action-btn:hover { background-color: #992222; }

        .death-certificate {
            background: #fffdf9;
            border: 2px solid var(--crimson);
            box-shadow: inset 0 0 0 2px var(--parchment-card), inset 0 0 0 3px var(--crimson);
            padding: 1.2rem;
            border-radius: 3px;
            margin-bottom: 1.25rem;
            text-align: center;
        }

        .cert-header {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--crimson);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .cert-sub {
            font-size: 0.75rem;
            color: var(--ink-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .cert-divider {
            border: none;
            border-top: 1px double var(--crimson);
            margin: 0.6rem auto;
            width: 80%;
        }

        .cert-body {
            text-align: left;
            font-size: 0.88rem;
            line-height: 1.5;
            margin: 0.8rem 0;
        }

        .cert-body p { margin-bottom: 0.4rem; }

        .cert-trivia {
            background: rgba(238, 227, 208, 0.5);
            border-left: 2px solid var(--crimson);
            padding: 0.5rem;
            margin-top: 0.6rem;
            font-size: 0.82rem;
        }

        .footer-share-section {
            border-top: 1px dashed var(--border);
            padding-top: 0.75rem;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            flex-wrap: wrap;
            font-size: 0.75rem;
            color: var(--ink-muted);
        }

        .share-btn {
            border: none;
            color: #fff;
            padding: 0.35rem 0.6rem;
            border-radius: 3px;
            cursor: pointer;
            font-family: sans-serif;
            font-size: 0.72rem;
            font-weight: bold;
            display: inline-block;
        }

        .share-native { background-color: var(--gold); color: #000; }
        .share-fb { background-color: #1877f2; }
        .share-x { background-color: #000; }
        .share-wa { background-color: #25d366; }
        .share-copy { background-color: #4a3e35; }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="top-nav">
        <button class="top-nav-btn" onclick="goHome()">⌂ Home</button>
        <button class="top-nav-btn" id="music-toggle" onclick="toggleBGM()">Music: OFF</button>
    </div>

    <div class="header-tag">Survive the Empire</div>
    <h1 class="title">Can You Survive 30 Days<br>of Spanish Colonial Life?</h1>

    <hr class="decorative-hr">

    <div id="game-content">Loading archive manuscripts...</div>

    <div class="footer-share-section">
        <span>Share:</span>
        <button class="share-btn share-native" onclick="shareGeneral('native')">Share</button>
        <button class="share-btn share-fb" onclick="shareGeneral('fb')">FB</button>
        <button class="share-btn share-x" onclick="shareGeneral('x')">X</button>
        <button class="share-btn share-wa" onclick="shareGeneral('wa')">WhatsApp</button>
        <button class="share-btn share-copy" onclick="shareGeneral('copy')">Copy</button>
    </div>
</div>

<script>
    const BASE_GAME_URL = "https://survivetheempire.paoloalcid.com/";

    let SCENARIO_DATABASE = [];
    let currentDay = 0;
    let shuffledScenarios = [];
    let isBgmOn = false;

    async function loadScenarios() {
        try {
            const res = await fetch('scenarios.json');
            SCENARIO_DATABASE = await res.json();
            renderIntroScreen();
        } catch (e) {
            console.error("Failed to load scenario data:", e);
            document.getElementById('game-content').innerHTML = `
                <div class="intro-box" style="border-left-color: var(--crimson);">
                    <strong>Error:</strong> Could not load archival records. Verify <code>scenarios.json</code> exists in your repository root.
                </div>
            `;
        }
    }

    function toggleBGM() {
        isBgmOn = !isBgmOn;
        document.getElementById('music-toggle').innerText = `Music: ${isBgmOn ? 'ON' : 'OFF'}`;
    }

    function goHome() {
        currentDay = 0;
        renderIntroScreen();
    }

    function renderIntroScreen() {
        const container = document.getElementById('game-content');
        container.innerHTML = `
            <div class="intro-box">
                Every day, you wake up in a different time between 1565 and 1898 in <strong>Spanish-era Filipinas</strong>. Displaced across time, you are bound by strict curfews, monastic decrees, forced labor, and caste etiquette.
                <span class="intro-challenge">Can you survive 30 time shifts and return to the present day?</span>
            </div>
            <button class="action-btn" onclick="startNewGame()">Enter the Shift</button>
        `;
    }

    function startNewGame() {
        currentDay = 0;
        let pool = [...SCENARIO_DATABASE];
        for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
        }

        shuffledScenarios = [];
        while (shuffledScenarios.length < 30) {
            shuffledScenarios.push(...pool);
        }
        shuffledScenarios = shuffledScenarios.slice(0, 30);

        if (typeof gtag === 'function') {
            gtag('event', 'game_start');
        }

        renderScenario();
    }

    function renderScenario() {
        const container = document.getElementById('game-content');
        const s = shuffledScenarios[currentDay];
        
        let imgHtml = s.image ? `<img class="scenario-image" src="${s.image}" onerror="this.style.display='none'">` : '';
        let sourceHtml = s.sourceCitation ? `<div class="scenario-source">Source: ${s.sourceCitation}</div>` : '';

        let choicesHtml = '';
        s.choices.forEach((choice, idx) => {
            choicesHtml += `
                <button class="choice-btn" onclick="handleChoice(${idx})">
                    ${choice.text}
                </button>
            `;
        });

        container.innerHTML = `
            <div class="status-bar">
                <span>Shift: Day ${currentDay + 1} of 30</span>
                <span>Status: Alive</span>
            </div>
            <div class="scenario-box">
                <div class="scenario-year">${s.year}</div>
                ${imgHtml}
                <div>${s.lore}</div>
                ${sourceHtml}
            </div>
            <div class="choices-grid">
                ${choicesHtml}
            </div>
        `;
    }

    function handleChoice(index) {
        const s = shuffledScenarios[currentDay];
        const selected = s.choices[index];

        // GA4 Telemetry
        if (typeof gtag === 'function') {
            gtag('event', 'scenario_answered', {
                'scenario_id': s.id || `shift-${currentDay + 1}`,
                'scenario_year': s.year,
                'choice_text': selected.text.substring(0, 40),
                'survived': selected.survival ? 'yes' : 'no',
                'day_number': currentDay + 1
            });
        }

        if (selected.survival) {
            currentDay++;
            if (currentDay >= 30) {
                if (typeof gtag === 'function') {
                    gtag('event', 'game_won');
                }
                renderVictoryScreen();
            } else {
                renderScenario();
            }
        } else {
            if (typeof gtag === 'function') {
                gtag('event', 'game_death', {
                    'day_died': currentDay + 1,
                    'cause_of_death': selected.cause
                });
            }
            renderDeathScreen(currentDay + 1, selected.cause, selected.trivia, s.sourceCitation);
        }
    }

    function renderDeathScreen(day, cause, trivia, source) {
        const container = document.getElementById('game-content');
        let sourceNote = source ? `<p style="margin-top:0.4rem; font-size:0.75rem; color:var(--ink-muted);"><em>Reference: ${source}</em></p>` : '';

        container.innerHTML = `
            <div class="death-certificate">
                <div class="cert-header">Acta de Defunción</div>
                <div class="cert-sub">Gobierno Superior de Filipinas</div>
                <hr class="cert-divider">
                <div class="cert-body">
                    <p><strong>Days Survived:</strong> Shift ${day} of 30</p>
                    <p><strong>Cause of Demise:</strong> ${cause}</p>
                    <div class="cert-trivia">
                        <strong>Historical Fact:</strong> ${trivia}
                    </div>
                    ${sourceNote}
                </div>
                <hr class="cert-divider">
            </div>

            <div style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem;">
                <button class="action-btn" onclick="startNewGame()">Try Another Timeline</button>
            </div>
        `;
    }

    function renderVictoryScreen() {
        const container = document.getElementById('game-content');
        container.innerHTML = `
            <div class="death-certificate" style="border-color: var(--green);">
                <div class="cert-header" style="color: var(--green);">Gloria Y Victoria</div>
                <div class="cert-sub">The Temporal Rift Stabilizes</div>
                <hr class="cert-divider" style="border-color: var(--green);">
                <div class="cert-body">
                    <p>You have survived all <strong>30 temporal shifts</strong> across 333 years of Spanish colonial rule.</p>
                    <p>The rift has reopened. You step through and return safely to the modern era.</p>
                </div>
                <hr class="cert-divider" style="border-color: var(--green);">
            </div>
            <button class="action-btn" style="background-color: var(--green);" onclick="goHome()">Play Again</button>
        `;
    }

    function shareGeneral(platform) {
        const text = "Can you survive 30 temporal shifts in Spanish-era Filipinas? One mistake means execution or exile.";
        const url = BASE_GAME_URL;

        if (platform === 'native') {
            if (navigator.share) {
                navigator.share({ title: 'Survive the Empire', text: text, url: url }).catch(() => {});
            } else {
                navigator.clipboard.writeText(`${text} ${url}`);
                alert("Game link copied to clipboard!");
            }
        } else if (platform === 'fb') {
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`, '_blank');
        } else if (platform === 'x') {
            window.open(`https://x.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`, '_blank');
        } else if (platform === 'wa') {
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text + " " + url)}`, '_blank');
        } else if (platform === 'copy') {
            navigator.clipboard.writeText(`${text} ${url}`);
            alert("Game link copied to clipboard!");
        }
    }

    window.onload = loadScenarios;
</script>

</body>
</html>
