<script>
    let audioCtx = null;
    let isBgmPlaying = false;
    let bgmInterval = null;

    function initAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    const bgmScale = [220, 261.63, 329.63, 392.00, 440, 523.25, 392.00, 329.63];
    let bgmStep = 0;

    function playHarpsichordPluck(freq) {
        if (!audioCtx || !isBgmPlaying) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.9);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.9);
        } catch (e) {}
    }

    function startBGM() {
        initAudioContext();
        if (isBgmPlaying) return;
        isBgmPlaying = true;
        document.getElementById('music-toggle').innerText = "Music: ON";
        bgmInterval = setInterval(() => {
            if (isBgmPlaying) {
                playHarpsichordPluck(bgmScale[bgmStep]);
                bgmStep = (bgmStep + 1) % bgmScale.length;
            }
        }, 550);
    }

    function stopBGM() {
        isBgmPlaying = false;
        if (bgmInterval) clearInterval(bgmInterval);
        document.getElementById('music-toggle').innerText = "Music: OFF";
    }

    function toggleBGM() {
        if (isBgmPlaying) stopBGM();
        else startBGM();
    }

    function playDing() {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
            osc.frequency.setValueAtTime(880.00, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.6);
        } catch (e) {}
    }

    function playDeathSound() {
        if (!audioCtx) return;
        try {
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = "sawtooth";
            osc1.frequency.setValueAtTime(160, audioCtx.currentTime);
            osc1.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 1.8);
            gain1.gain.setValueAtTime(0.35, audioCtx.currentTime);
            gain1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.8);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start();
            osc1.stop(audioCtx.currentTime + 1.8);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = "triangle";
            osc2.frequency.setValueAtTime(115, audioCtx.currentTime);
            osc2.frequency.exponentialRampToValueAtTime(28, audioCtx.currentTime + 1.8);
            gain2.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.8);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start();
            osc2.stop(audioCtx.currentTime + 1.8);
        } catch (e) {}
    }

    function playVictoryFanfare() {
        if (!audioCtx) return;
        try {
            const notes = [
                { f: 523.25, time: 0.0, dur: 0.15 },
                { f: 659.25, time: 0.18, dur: 0.15 },
                { f: 783.99, time: 0.36, dur: 0.15 },
                { f: 1046.50, time: 0.54, dur: 0.60 }
            ];
            notes.forEach(note => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "triangle";
                osc.frequency.setValueAtTime(note.f, audioCtx.currentTime + note.time);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime + note.time);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + note.time + note.dur);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + note.time);
                osc.stop(audioCtx.currentTime + note.time + note.dur);
            });
        } catch (e) {}
    }

    const masterQuestionPool = [
        // Days 1-5: Daily Street Life & Public Etiquette
        {
            era: "1884 - Pueblo Streets",
            scenario: "The Guardia Civil stops you at dusk outside the town plaza and demands identification. What do you present?",

                { text: "Present your Cédula Personal tax certificate", result: "SURVIVE" },
                { text: "Offer a handwritten letter of passage from your cousin", result: "DIED: Branded a vagamundo (vagrant). Dragged to the provincial stockade where you perish of cholera.", img: "" },
                { text: "Hand over an uninspected foreign gold coin", result: "DIED: Arrested on the spot for smuggling unauthorized foreign bullion; summarily executed for treason.", img: "" }
            ],
            history: "The 1884 Royal Decree replaced the archaic tribute system with the mandatory Cédula Personal identity tax certificate."
        },
        {
            era: "1875 - Church Plaza",
            scenario: "The church bell rings the 8:00 PM De Profundis (Campanadas de Ánimas). What must you immediately do?",
            choices: [
                { text: "Stop walking, remove your salakot, and recite a prayer for the dead", result: "SURVIVE" },
                { text: "Dash quickly into the nearest tavern for an evening drink", result: "DIED: The alguaciles catch you ignoring sacred rites. You receive 50 public lashes and succumb to your wounds.", img: "" },
                { text: "Whistle a lively folk tune to keep your walking pace", result: "DIED: Branded a public blasphemer and turned over to ecclesiastical authorities for severe corporal penance.", img: "" }
            ],
            history: "Evening bell rites were strictly enforced by colonial parishes; failure to show public piety was treated as open sacrilege."
        },
        {
            era: "1878 - Calle Real",
            scenario: "A Spanish Peninsular official rides past on horseback along the cobblestone highway. What is your required reaction?",
            choices: [
                { text: "Step aside, take off your headwear, and bow respectfully until he passes", result: "SURVIVE" },
                { text: "Wave enthusiastically and shout a casual greeting in Spanish", result: "DIED: Flogged for insolence and lack of deference to colonial authorities.", img: "" },
                { text: "Continue walking down the center of the road ignoring him", result: "DIED: Struck down by the carriage escort and jailed for public disrespect to the Crown.", img: "" }
            ],
            history: "Strict racial and sumptuary codes required indios and mestizos to show overt deference to Spanish peninsulares in public."
        },
        {
            era: "1880 - Binondo Commercial District",
            scenario: "You are an Indio artisan entering a Spanish-owned pharmacy on Calle Rosario. How do you address the shopkeeper?",
            choices: [
                { text: "Address him politely as Señor or Don and wait to be acknowledged", result: "SURVIVE" },
                { text: "Slap him on the shoulder and ask for his cheapest ointment in Tagalog", result: "DIED: Beaten by municipal police and jailed for disorderly insolence.", img: "" },
                { text: "Demand to be served before Spanish customers who arrived earlier", result: "DIED: Ejected by force; charged with inciting public disorder.", img: "" }
            ],
            history: "Rigid racial hierarchies strictly enforced deferential titles and submissive public etiquette toward European merchants."
        },
        {
            era: "1874 - Town Plaza Midday",
            scenario: "The midday sun over the cobblestone plaza is blistering. You need to shield yourself from the heat while crossing the square. How do you protect yourself?",
            choices: [
                { text: "Wear a woven salakot or drape a modest cloth over your head and move quickly along the shaded arcades", result: "SURVIVE" },
                { text: "Open an ornate silk folding umbrella (quitasol) to stroll casually across the open plaza", result: "DIED: Using an aristocratic parasol without Spanish noble or elite Principalía rank violates strict sumptuary customs; municipal alguaciles administer 15 lashes for insolent presumption of rank.", img: "" },
                { text: "Walk directly behind the Alcalde Mayor to share the shade cast by his servant's ceremonial canopy", result: "DIED: His armed retinue assumes you are attempting an assassination; clubbed to the ground by rifle butts.", img: "" }
            ],
            history: "Sumptuary customs reserved decorative umbrellas (quitasoles) for colonial dignitaries, high clergy, and the principalía."
        },

        // Days 6-10: Bureaucracy, Names & Taxes
        {
            era: "1849 - Municipal Tribunal",
            scenario: "Governor-General Narciso Clavería issues his naming decree. The Cabeza de Barangay hands you the Catálogo. What is your move?",
            choices: [
                { text: "Select an assigned surname from the Catálogo for your household", result: "SURVIVE" },
                { text: "Adopt the noble surname of the Governor-General without permission", result: "DIED: Usurping noble Castilian names without proven lineage lands you in penal exile to the Marianas.", img: "" },
                { text: "Refuse to pick a surname and declare sovereign independence", result: "DIED: Summary execution via garrote for open defiance against the Royal Audiencia.", img: "" }
            ],
            history: "The 1849 Clavería Decree standardized native and colonial tax registries using the Catálogo Alfabético de Apellidos."
        },
        {
            era: "1840 - Town Tribunal",
            scenario: "You are eligible to pay the annual Tributo. You lack silver pesos but possess produce. What acceptable tribute in kind can you surrender?",
            choices: [
                { text: "Standard measures of unhusked palay (rice) or bundles of abaca fiber", result: "SURVIVE" },
                { text: "Handmade wooden toy carvings of Spanish galleons", result: "DIED: Goods rejected; livestock seized; jailed for tax evasion.", img: "" },
                { text: "Foreign banknotes from British merchant houses in Hong Kong", result: "DIED: Suspected of illegal foreign trade; arrested for contraband.", img: "" }
            ],
            history: "The colonial tribute system strictly regulated acceptable goods in kind, restricting them to staple commodities like unhusked rice and abaca."
        },
        {
            era: "1865 - Provincial Boundary",
            scenario: "You are traveling between provinces to sell pottery. The Guardia Civil post demands your travel credentials. What document is required?",
            choices: [
                { text: "Your Pasaporte de Interior (domestic internal travel passport)", result: "SURVIVE" },
                { text: "A verbal promise that your parish friar knows your character", result: "DIED: Detained as an unregistered vagrant and assigned to two years of unpaid penal labor.", img: "" },
                { text: "A drawing of your ancestral home", result: "DIED: Ridiculed and jailed indefinitely as an undocumented trespasser.", img: "" }
            ],
            history: "Inter-provincial movement within the archipelago required stamped internal passports to prevent peasant flight."
        },
        {
            era: "1888 - Pueblo Casa Tribunal",
            scenario: "The municipal scribe is compiling the annual padrón de almas (civil census registry). How many members of your household do you report?",
            choices: [
                { text: "Declare every living resident accurately to match baptismal and tribute records", result: "SURVIVE" },
                { text: "Declare the head of household only", result: "DIED: Listing only your frail grandfather to conceal the rest of your taxable kin causes authorities to sentence you and him to the limestone quarries, where you both succumb to exhaustion and dysentery.", img: "" },

                { text: "Smuggle the rejected tobacco leaves into town to sell privately", result: "DIED: Caught by the Carabineros de Hacienda. Summary hanging for illicit tobacco contraband.", img: "" },

        {

                { text: "Load the sugar onto the schooner", result: "DIED: Evading harbor customs tariffs and colonial trade registries prompts royal revenue cutters to seize the vessel; you are sentenced to the galleys for life.", img: "" },

    let sessionDeck = [];
    let currentStep = 0;
    let daysSurvived = 0;

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

function goHome() {
        renderIntroScreen();
    }

    function renderIntroScreen() {
        const container = document.getElementById('game-content');
        container.innerHTML = `
            <div class="intro-box">
                <div class="intro-lore">
                    You are from present day in a former Spanish colony. Through an inexplicable twist of fate, you wake up in 
                    <strong>Spanish colonial Filipinas (circa 1565–1898)</strong>. 
                    <br><br>
                    You are now bound by strict curfews, monastic decrees, forced labor and caste etiquette. One wrong assumption or breach of protocol will result in immediate execution, fatal disease or penal exile.
                    <span class="intro-challenge">Can you survive all 30 days?</span>
                </div>
                <button class="action-btn" onclick="startGameFromIntro()">Enter</button>
            </div>
        `;
    }
    function startGameFromIntro() {
        startBGM();
        startNewGame();
    }

    function startNewGame() {
        sessionDeck = [...masterQuestionPool];
        currentStep = 0;
        daysSurvived = 0;
        renderScenario();
    }

    function renderScenario(animateGreen = false) {
        const container = document.getElementById('game-content');
        const totalDays = sessionDeck.length;

        if (currentStep >= sessionDeck.length) {
            playVictoryFanfare();
            container.innerHTML = `
                <div class="death-screen" style="border-color: var(--gold); background: #fdfaf0;">
                    <div class="header-tag" style="color: var(--gold);">Gloria Y Victoria</div>
                    <div class="death-title" style="color: var(--gold);">Sobreviviente!</div>
                    <img src="images/victory.jpg" alt="Victory" class="outcome-img" onerror="this.style.display='none'">
                    <p style="font-size: 1.05rem; margin: 1rem 0; line-height: 1.6;">
                        Against all odds, you navigated the decrees, curfews, tithes, and inquisitions. 
                        <strong>You survived 30 full days (1 month) of Spanish Colonial Life!</strong>
                    </p>
                    <div class="share-prompt">Dare your friends to beat your 30-day run:</div>
                    <button class="action-btn" style="background: var(--border);" onclick="startNewGame()">Play Again</button>
                </div>
            `;
            return;
        }

        const currentQ = sessionDeck[currentStep];
        const shuffledChoices = shuffle([...currentQ.choices]);

        container.innerHTML = `
            <div class="era-header">${currentQ.era}</div>
            <div id="day-counter" class="day-counter-box ${animateGreen ? 'ding-green' : ''}">
                Day ${daysSurvived + 1} of 30 (Score: ${daysSurvived} Days)
            </div>
            <div class="divider"></div>
            <div class="scenario-box">${currentQ.scenario}</div>
            <div class="choices-grid" id="choices-container"></div>
        `;

        const choicesContainer = document.getElementById('choices-container');
        shuffledChoices.forEach(choice => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = choice.text;
            btn.onclick = () => handleChoice(choice, currentQ, btn);
            choicesContainer.appendChild(btn);
        });
    }

    function handleChoice(choice, questionData, clickedBtn) {
        if (choice.result === "SURVIVE") {
            playDing();
            daysSurvived++;
            currentStep++;
            if (clickedBtn) clickedBtn.classList.add('correct-glow');
            
            setTimeout(() => {
                renderScenario(true);
            }, 300);
        } else {
            playDeathSound();
            renderDeathScreen(choice.result, questionData, choice);
        }
    }

    function renderDeathScreen(deathReason, questionData, choiceData) {
        const container = document.getElementById('game-content');
        
        const imgTag = choiceData && choiceData.img 
            ? `<img src="${choiceData.img}" alt="Death illustration" class="outcome-img" onerror="this.style.display='none'">` 
            : '';

        container.innerHTML = `
            <div class="death-screen">
                <div class="header-tag" style="color: var(--blood);">Certificado de Defunción</div>
                <div class="death-title">DEAD</div>
                ${imgTag}
                <div class="death-reason"><strong>Cause of Death:</strong> ${deathReason.replace('DIED: ', '')}</div>
                <div class="history-note"><strong>Historical Reality:</strong> ${questionData.history}</div>
                <div style="margin-top: 1rem; font-size: 0.95rem; font-weight: bold; color: var(--border);">
                    You survived only ${daysSurvived} ${daysSurvived === 1 ? 'Day' : 'Days'} in Spanish Colonial Life.
                </div>
                <div class="share-prompt">Can your friends survive longer than ${daysSurvived} days?</div>
                <button class="action-btn" onclick="startNewGame()">Try Again</button>
            </div>
        `;
    }

    function getShareText() {
        if (daysSurvived >= 30) {
            return `I conquered all 30 days and survived a full month of Spanish colonial life! Think you can make it out alive? #SurviveTheEmpire`;
        } else if (daysSurvived > 0) {
            return `I survived only ${daysSurvived} ${daysSurvived === 1 ? 'day' : 'days'} in Spanish colonial life before meeting my demise. Can you survive a full month? #SurviveTheEmpire`;
        }
        return `Can you survive 30 days in Spanish colonial life? Test your survival instincts in 'Survive the Empire'! #SurviveTheEmpire`;
    }

    function getShareUrl() {
        return window.top !== window.self ? document.referrer || window.location.href : window.location.href;
    }

    function shareNative() {
        const shareData = {
            title: "Survive the Empire: Spanish Colonial Life",
            text: getShareText(),
            url: getShareUrl()
        };
        if (navigator.share) {
            navigator.share(shareData).catch(() => {});
        } else {
            copyGameLink();
        }
    }

    function shareFacebook() {
        const url = encodeURIComponent(getShareUrl());
        window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}&quote=${encodeURIComponent(getShareText())}`, '_blank', 'width=600,height=400');
    }

    function shareX() {
        const url = encodeURIComponent(getShareUrl());
        const text = encodeURIComponent(getShareText());
        window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank', 'width=600,height=400');
    }

    function shareWhatsApp() {
        const text = encodeURIComponent(`${getShareText()}\n${getShareUrl()}`);
        window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
    }

    function copyGameLink() {
        const shareText = `${getShareText()} ${getShareUrl()}`;
        navigator.clipboard.writeText(shareText).then(() => {
            alert("Score and link copied to clipboard!");
        }).catch(() => {
            alert("Failed to copy link. Please copy directly: " + getShareUrl());
        });
    }

    renderIntroScreen();
</script>
